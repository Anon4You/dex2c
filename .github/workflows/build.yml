name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the fat jar
        run: ./gradlew shadowJar

      - name: Collect the artifact
        run: |
          set -e
          mkdir -p dist
          cp build/libs/dex2c.jar dist/dex2c.jar
          (cd dist && sha256sum dex2c.jar > SHA256SUMS)

      - name: Smoke test
        run: java -jar dist/dex2c.jar --version

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex2c
          path: dist/
          retention-days: 30
